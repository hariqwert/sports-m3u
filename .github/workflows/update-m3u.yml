name: Auto Update Sports M3U Playlist

on:
  schedule:
    # Runs daily at 11:52 PM IST (18:22 UTC)
    - cron: '22 18 * * *'
    # Also runs recurring every 45 minutes to refresh expiring tokens
    - cron: '*/45 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Enables git push write access for GITHUB_TOKEN
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run M3U Extractor
        run: node fetch_real_m3u.cjs

      - name: Copy to sports.m3u
        run: cp playlist.m3u sports.m3u

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sports.m3u playlist.m3u channels.json
          git diff-index --quiet HEAD || git commit -m "Auto-update sports.m3u playlist at 11:52 PM IST"
          git pull --rebase origin main
          git push
