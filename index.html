<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream — Watch Anime Online Free</title>
    <!-- Google Fonts & CDN dependencies -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="/" class="logo" onclick="resetHome(event)">
            <span>Anime</span>Stream
        </a>
        <div class="search-bar-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search anime title... (e.g. Naruto, Solo Leveling)" autocomplete="off">
            <div id="searchResults" class="search-results-dropdown"></div>
        </div>
    </header>

    <main>
        <!-- Featured Hero Banner -->
        <div class="hero-banner" id="heroBanner">
            <img class="hero-bg" src="https://gogocdn.net/cover/demon-slayer-kimetsu-no-yaiba.png" alt="Demon Slayer Hero">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1 class="hero-title" id="heroTitle">Demon Slayer: Kimetsu no Yaiba</h1>
                <p class="hero-desc" id="heroDesc">A high-stakes battle for survival where destiny, power, and courage collide.</p>
                <button class="btn-primary" onclick="watchAnime('demon-slayer-kimetsu-no-yaiba')">▶ Watch Season 1 Now</button>
            </div>
        </div>

        <!-- Video Player & Episode Selector Section -->
        <section id="playerSection" class="player-section">
            <div class="player-header">
                <h2 id="nowPlayingTitle" class="player-title">Demon Slayer — Episode 1</h2>
                <button class="btn-primary" style="padding: 8px 16px; font-size: 13px;" onclick="closePlayer()">✕ Close Player</button>
            </div>
            
            <div id="artplayer" class="player-box"></div>

            <div class="episodes-box">
                <h3 class="episodes-title">Episode Select</h3>
                <div id="episodesGrid" class="episodes-grid"></div>
            </div>
        </section>

        <!-- Trending Anime Grid -->
        <section>
            <h2 class="section-title">Trending & Popular Anime</h2>
            <div id="animeGrid" class="anime-grid">
                <!-- Dynamic cards populated via JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 AnimeStream. High performance open anime streaming engine powered by Consumet API & HLS.js.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
